name: Check and deploy

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  # Uploads the checked site to Cloudflare Pages. Runs only on main and only
  # once the CLOUDFLARE_API_TOKEN repository secret exists (see README).
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip when no Cloudflare token is set
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN secret not set; skipping deploy."
      - uses: actions/download-artifact@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          name: site
          path: dist
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
      - name: Create the Pages project if it doesn't exist yet
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages project create palworld-breeding --production-branch=main || echo "Project already exists."
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy dist --project-name=palworld-breeding --branch=main --commit-dirty=true

  # Publishes the site on GitHub Pages (free for public repositories) at
  # https://afaisalfasi007-pixel.github.io/eggpair/. Needs
  # Settings → Pages → Source: "GitHub Actions" (see README).
  github-pages:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_URL: https://afaisalfasi007-pixel.github.io/eggpair
      # Repository variable (Settings > Secrets and variables > Actions > Variables).
      # Empty until you create a GA4 property; then analytics turns on after consent.
      GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
